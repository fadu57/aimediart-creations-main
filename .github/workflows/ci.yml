# CI baseline — garde-fous côté serveur (agnostiques de l'agent).
# Applique en CI ce que les hooks Claude Code garantissent en local :
# scan de secrets, audit de dépendances, lint/tests, isolation tenant.
# Référence : ~/.claude/pilotage/engineering-standards.md et fleet-structure.md.
#
# Adapté pour Aimediart (Vite/React + Supabase) :
#   - NODE_VERSION 24 (engines: "24.x" dans package.json) ;
#   - scripts présents : `lint` (eslint), `typecheck` (tsc --noEmit) et
#     `test` (vitest run) — un job indépendant chacun, bloquants sans
#     --if-present : chaque signal reste visible même si un autre échoue ;
#   - `test:tenant-isolation` (AIM-30, scripts/test-tenant-isolation-audio-files.mjs) :
#     démarre le stack Supabase local et vérifie l'isolation RLS/GRANT du
#     rôle anon sur audio_files. À étendre table par table au fil des tickets.

name: CI

on:
  pull_request:
  push:
    branches: [main] # les branches de PR sont couvertes par pull_request

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  # Scan de secrets — bloquant sur tout push et PR.
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks inspecte l'historique, pas juste HEAD
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Audit de vulnérabilités des dépendances — bloquant (high et au-dessus).
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # Prod deps only : les high restants sont dans la chaîne eslint (dev), hors runtime.
      - run: npm audit --audit-level=high --omit=dev

  # Lint, types, tests — trois jobs indépendants et bloquants : l'échec de
  # l'un ne masque pas le signal des autres.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test

  # Isolation multi-tenant — invariant SaaS critique (le mode d'échec n°1
  # d'un SaaS, voir engineering-standards.md « Invariants SaaS »).
  # Démarre le stack Supabase local (Docker, migrations appliquées
  # automatiquement) puis exécute test:tenant-isolation (RLS/GRANT sur
  # audio_files, rôle anon — AIM-30). À étendre à d'autres tables/policies
  # au fil des tickets suivants.
  #
  # NON BLOQUANT (continue-on-error) pour l'instant : AIM-173 a remplacé les
  # 74 migrations legacy (`migration_NN_*.sql`, jamais rejouées par le CLI
  # Supabase à froid) par une baseline unique
  # (supabase/migrations/20260101000000_baseline_schema.sql), vérifiée
  # empiriquement sur un volume Docker vierge en local (rejeu complet sans
  # erreur SQL, `rls_is_global_admin()` présente, test:tenant-isolation vert).
  # `continue-on-error` reste en place jusqu'à preuve empirique que ce job
  # passe réellement de bout en bout sur un runner GitHub Actions — un volume
  # authentiquement vierge, distinct du local. Retirer seulement une fois ce
  # run confirmé vert (AC3, AIM-173).
  tenant-isolation:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer le stack Supabase local
        run: supabase start
      - name: Assertion baseline — public.rls_is_global_admin() existe
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -c "select public.rls_is_global_admin();"
      - name: Tenant isolation tests
        run: npm run test:tenant-isolation
      - name: Arrêter le stack Supabase local
        if: always()
        run: supabase stop
